name: Build Anki deck

on:
  push:
    branches: ["main"]
    paths:
      - "decks/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "decks/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate cards
        run: python scripts/validate_cards.py

      - name: Build deck
        run: python scripts/build_anki.py

      - name: Upload deck artifact
        uses: actions/upload-artifact@v4
        with:
          name: XGZ_Jazz_Arpeggios
          path: dist/XGZ_Jazz_Arpeggios.apkg
